name: 功能建议 / Feature request
description: 描述实际使用场景与希望解决的问题。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem to solve
      description: 请描述你的使用场景，而不只是列出一个功能名称。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 希望的交互 / Suggested behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方式 / Current workaround
      description: 可选。请勿上传私人数据或凭据。
