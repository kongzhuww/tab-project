name: Submit to Chrome Web Store

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CHROME_CLIENT_ID:
        required: false
      CHROME_CLIENT_SECRET:
        required: false
      CHROME_REFRESH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable Release tag to submit (for example v1.0.14)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chrome-store-submission
  cancel-in-progress: false

jobs:
  submit:
    name: Chrome Store Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/chrome-store-publish.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Download and validate published Release package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || exit 1
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > release.json
          node --input-type=module -e '
            import fs from "node:fs";
            const r = JSON.parse(fs.readFileSync("release.json", "utf8"));
            if (r.isDraft || r.isPrerelease) throw new Error("Stable published Release required");
          '
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets \
            --pattern "tab-project-${RELEASE_TAG}-extension.zip" --pattern SHA256SUMS.txt
          cd release-assets
          # Validate exactly the intended archive; do not trust arbitrary checksum paths.
          expected=$(awk -v f="tab-project-${RELEASE_TAG}-extension.zip" '($2 == f || $2 == "./" f) && $1 ~ /^[0-9a-f]+$/ && length($1) == 64 {print $1}' SHA256SUMS.txt)
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || exit 1
          printf '%s  %s\n' "$expected" "tab-project-${RELEASE_TAG}-extension.zip" | sha256sum --check -
          unzip -p "tab-project-${RELEASE_TAG}-extension.zip" manifest.json > ../store-manifest.json
          node --input-type=module -e '
            import fs from "node:fs";
            const m = JSON.parse(fs.readFileSync("../store-manifest.json", "utf8"));
            if ("v" + m.version !== process.env.RELEASE_TAG || m.manifest_version !== 3)
              throw new Error("Release tag and MV3 package version must match");
          '
      - name: Upload package and submit to Chrome Web Store
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID || 'hogpkihhicjhiakkgjkbchpdoicmbolj' }}
          CHROME_RELEASE_TAG: ${{ inputs.tag }}
        continue-on-error: true
        run: node scripts/chrome-store-publish.mjs
