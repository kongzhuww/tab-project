name: Publish Extension Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_latest:
        description: 'Publish as latest release'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: extension-release-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate tag before installing dependencies
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            if (!/^\d+\.\d+\.\d+(?:\.\d+)?$/.test(m.version) || p.version !== m.version) {
              throw new Error("Package and manifest versions must match");
            }
            if (process.env.GITHUB_REF_TYPE === "tag" && process.env.RELEASE_TAG !== `v${m.version}`) {
              throw new Error("Tag, package and manifest versions must match");
            }
          '
      - run: npm ci
      - name: Release policy regression tests
        run: npm test
      - name: Typecheck and isolated extension build
        id: build
        run: npm run release:build
      - name: Package extension and checksum
        env:
          EXTENSION_DIR: ${{ steps.build.outputs.extension_dir }}
          BUILD_INFO: ${{ steps.build.outputs.build_info }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          archive="$GITHUB_WORKSPACE/release-assets/tab-project-v${VERSION}-extension.zip"
          (cd "$EXTENSION_DIR" && zip -q -r "$archive" .)
          cp "$BUILD_INFO" release-assets/build-info.json
          (cd release-assets && sha256sum ./*.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout, npm install or project code execution in this privileged job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets
      - name: Verify new release, provenance and tag
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # BEGIN RELEASE GUARD
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');

          async function main() {
            const { VERSION: version, GH_REPO: repo, GH_TOKEN: token,
              SOURCE_SHA: sourceSha, RELEASE_TAG: ref, GITHUB_REF_TYPE: refType } = process.env;
            if (!/^\d+\.\d+\.\d+(?:\.\d+)?$/.test(version || ''))
              throw new Error('Invalid release version');
            if (!/^[\w.-]+\/[\w.-]+$/.test(repo || '') || !token ||
                !/^[0-9a-f]{40}$/.test(sourceSha || ''))
              throw new Error('Invalid release identity');
            const tag = 'v' + version;
            if (refType === 'tag' && ref !== tag)
              throw new Error('Release tag and version differ');

            const archive = 'tab-project-' + tag + '-extension.zip';
            const assets = fs.readdirSync('release-assets').sort();
            const expected = ['SHA256SUMS.txt', 'build-info.json', archive].sort();
            if (JSON.stringify(assets) !== JSON.stringify(expected))
              throw new Error('Unexpected release asset set');
            for (const name of assets) {
              if (!fs.lstatSync('release-assets/' + name).isFile())
                throw new Error('Release assets must be regular files');
            }
            const sums = fs.readFileSync('release-assets/SHA256SUMS.txt', 'utf8').trim().split(/\r?\n/);
            const match = sums.length === 1 && sums[0].match(/^([a-f0-9]{64})  (?:\.\/)?([^/\\]+)$/);
            if (!match || match[2] !== archive)
              throw new Error('Invalid release checksum manifest');
            const digest = crypto.createHash('sha256')
              .update(fs.readFileSync('release-assets/' + archive)).digest('hex');
            if (digest !== match[1]) throw new Error('Release checksum mismatch');
            const info = JSON.parse(fs.readFileSync('release-assets/build-info.json', 'utf8'));
            if (info.version !== version || info.commit !== sourceSha ||
                info.environment !== 'github-actions')
              throw new Error('Release provenance mismatch');
            const manifest = JSON.parse(execFileSync('unzip',
              ['-p', 'release-assets/' + archive, 'manifest.json'],
              { encoding: 'utf8', maxBuffer: 1024 * 1024 }));
            if (manifest.version !== version || manifest.manifest_version !== 3)
              throw new Error('Release package version or format mismatch');

            async function api(path, allowMissing = false) {
              const response = await fetch('https://api.github.com/repos/' + repo + path, {
                headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28' },
                redirect: 'error', signal: AbortSignal.timeout(30000),
              });
              if (allowMissing && response.status === 404) return null;
              if (!response.ok) throw new Error('Release preflight HTTP ' + response.status);
              const data = await response.json();
              if (!data || typeof data !== 'object' || Array.isArray(data))
                throw new Error('Malformed release API response');
              return data;
            }
            // Check access first: auth/repository errors must not be mistaken for an absent release.
            await api('');
            const existing = await api('/releases/tags/' + encodeURIComponent(tag), true);
            if (existing !== null) throw new Error('Release already exists; no assets will be changed');
            let object = (await api('/git/ref/tags/' + encodeURIComponent(tag))).object;
            for (let depth = 0; object?.type === 'tag' && depth < 5; depth++) {
              if (!/^[0-9a-f]{40}$/.test(object.sha || '')) throw new Error('Invalid annotated tag');
              object = (await api('/git/tags/' + object.sha)).object;
            }
            if (object?.type !== 'commit' || object.sha !== sourceSha)
              throw new Error('Tag does not point to the built commit');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + '\n');
            console.log('Verified new immutable release ' + tag);
          }
          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
          # END RELEASE GUARD
      - name: Create new release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.guard.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PUBLISH_LATEST: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_latest }}
        run: |
          set -euo pipefail
          # Create only: an existing release or asset collision must fail, never update or retry.
          gh release create "$TAG" \
            "release-assets/tab-project-v${VERSION}-extension.zip" \
            release-assets/SHA256SUMS.txt release-assets/build-info.json \
            --verify-tag --latest="$PUBLISH_LATEST" --generate-notes \
            --title "tab-project ${TAG}"
  edge-store:
    needs: [build, publish]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/edge-store.yml
    with:
      tag: v${{ needs.build.outputs.version }}
    secrets:
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
