[package]
name = "fast-search"
version = "0.1.0"
edition = "2021"
description = "High-performance offline fuzzy search engine for tab-project"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"     # 优化生成最小的 wasm 体积
lto = true
codegen-units = 1
panic = "abort"
