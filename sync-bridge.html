<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>tab-project-next 配置一键过继中心</title>
    <style>
      * { box-sizing: border-box; }
      body { background: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; margin: 0; padding: 20px; }
      #vue-sync-bridge-root { min-height: calc(100vh - 40px); display: flex; justify-content: center; align-items: center; }
      .card { background: #151d30; border: 1px solid rgba(255,255,255,.1); border-radius: 20px; padding: 32px; max-width: 580px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.6); text-align: center; }
      h1 { font-size: 22px; margin-bottom: 8px; }
      p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
      .step-box { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 16px; text-align: left; font-size: 13px; line-height: 1.7; margin-bottom: 20px; color: #cbd5e1; }
      .step-box b { color: #a5b4fc; }
      .bridge-form { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
      .bridge-form label { color: #94a3b8; font-size: 12px; }
      .bridge-form input { width: 100%; background: #0b0f19; border: 1px solid rgba(255,255,255,.15); color: #fff; border-radius: 8px; padding: 10px 12px; font-size: 13px; }
      .btn { background: #6366f1; color: #fff; border: 0; border-radius: 12px; padding: 13px 20px; font-size: 14px; font-weight: 600; cursor: pointer; margin: 4px; }
      .btn.secondary { background: rgba(255,255,255,.08); }
      .btn:disabled { opacity: .5; cursor: default; }
      .status { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 13px; text-align: left; white-space: pre-line; }
      .status.success { background: rgba(16,185,129,.15); border: 1px solid #10b981; color: #34d399; }
      .status.error { background: rgba(239,68,68,.15); border: 1px solid #ef4444; color: #f87171; }
    </style>
  </head>
  <body>
    <div id="vue-sync-bridge-root">正在加载配置过继页…</div>
    <script type="module" src="generated/sync-bridge-ui.js"></script>
  </body>
</html>
